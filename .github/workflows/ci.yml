name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    # The schema is Postgres-only: the PostGIS extension, native enum types and
    # geometry columns have no SQLite equivalent, so tests need a real database.
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: sakuki_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Pint — check mode (no auto-fix in CI)
        run: ./vendor/bin/pint --test

      - name: Larastan — level 5
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sakuki_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
